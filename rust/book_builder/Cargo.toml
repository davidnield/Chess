[package]
name = "book_builder"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "The budget-book builder's core in Rust, called from Python (book_builder_rs)"

[lib]
name = "book_builder_rs"
# cdylib: the Python extension (book_builder_rs.pyd); rlib: cargo test links the kernels
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy", "dep:sha2"]
optimizer = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:microlp"]
# On for the extension build (build.ps1); off for `cargo test`, which links libpython.
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py311"], optional = true }
numpy = { version = "0.30", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "0.10", optional = true }
microlp = { version = "=0.8.0", optional = true }
# the same pin as rust/explorer_extract (GPL-3.0, like python-chess)
shakmaty = "=0.30.1"

[[bin]]
name = "optimizer-bench"
path = "src/bin/optimizer_bench.rs"
required-features = ["optimizer"]

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
