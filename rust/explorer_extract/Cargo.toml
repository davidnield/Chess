[package]
name = "explorer_extract"
version = "0.1.0"
edition = "2021"
publish = false
# shakmaty and python-chess are GPL-3.0; this tool is for private use.
license = "GPL-3.0-or-later"
description = "The explorer extract in Rust: Lichess games -> explorer partials, or a finished 512-bucket month"

[lib]
name = "explorer_extract"
path = "src/lib.rs"

[[bin]]
name = "explorer-extract"
path = "src/main.rs"

[dependencies]
shakmaty = "=0.30.1"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
# The SAN_REGEX fuzz's second oracle; the tool itself matches SAN by hand.
regex = "1.13"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 2
