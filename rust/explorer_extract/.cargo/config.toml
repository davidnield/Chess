# Static CRT (no VCRUNTIME140.dll on the target machine) and the x86-64-v3 ISA
# (AVX2, BMI2, FMA, LZCNT, MOVBE). The binary checks those features at startup
# and exits with a message instead of dying with STATUS_ILLEGAL_INSTRUCTION.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=x86-64-v3"]
