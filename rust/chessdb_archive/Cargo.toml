[package]
name = "chessdb-archive"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
sha2 = "0.10"
serde_json = "1"

[profile.release]
opt-level = 3

